<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor de rutas e incursiones</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <header class="top">
      <h1>Editor de</h1>
      <select id="mode" class="mode">
        <option value="route">Rutas</option>
        <option value="incursion">Incursiones</option>
      </select>
      <select id="load"></select>
      <button id="paste" type="button">Pegar código</button>
      <button id="reset" type="button">Nueva</button>
      <p id="summary" class="summary"></p>
    </header>
    <main class="editor">
      <div id="form" class="form"></div>
      <aside class="output">
        <section class="card">
          <h2>Avisos</h2>
          <ul id="issues" class="issues"></ul>
        </section>
        <section class="card">
          <div class="out-head">
            <h2>Código</h2>
            <span class="out-actions"><button id="write" type="button" class="primary" hidden>Guardar en el juego</button><button id="copy" type="button">Copiar</button></span>
          </div>
          <p id="code-hint" class="hint"></p>
          <pre id="code"></pre>
        </section>
        <section class="card" hidden>
          <div class="out-head"><h2>Añadir también</h2><button id="copy-extra" type="button">Copiar</button></div>
          <pre id="extra"></pre>
        </section>
      </aside>
    </main>
    <dialog id="paste-dialog" class="card paste">
      <h2 id="paste-title"></h2>
      <p id="paste-hint" class="hint"></p>
      <textarea id="paste-text" rows="18" spellcheck="false"></textarea>
      <p id="paste-error" class="paste-error"></p>
      <div class="paste-actions">
        <button id="paste-cancel" type="button">Cancelar</button>
        <button id="paste-load" type="button" class="primary">Cargar</button>
      </div>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
